<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-posta Gönderildi — Anlık Mekan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 16px; padding: 48px 44px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.07); }
        .icon { font-size: 48px; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
        p { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }
        .btn { display: inline-block; padding: 12px 28px; background: #2563eb; color: white; border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; transition: background .2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon"><span class="ic"><i data-lucide="mail"></i></span></div>
    <h1>E-posta Gönderildi!</h1>
    <p>Eğer bu adrese kayıtlı bir hesap varsa, şifre sıfırlama bağlantısı az sonra gelecek.<br><br>
    Gelen kutunu ve spam klasörünü kontrol et.</p>
    <a href="{% url 'login' %}" class="btn">Giriş Sayfasına Dön</a>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
<style>.ic { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; } .ic svg { width:1em; height:1em; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }</style>
</body>
</html>
