<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifremi Unuttum — Anlık Mekan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 16px; padding: 48px 44px; width: 100%; max-width: 420px; box-shadow: 0 4px 6px rgba(0,0,0,.04), 0 10px 28px rgba(0,0,0,.07); }
        .logo { font-size: 15px; font-weight: 900; letter-spacing: -.3px; margin-bottom: 32px; }
        .logo span { color: #2563eb; }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.3px; }
        p.sub { font-size: 14px; color: #64748b; margin-bottom: 28px; line-height: 1.6; }
        label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        input[type=email] { width: 100%; padding: 11px 14px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 15px; font-family: inherit; transition: .2s; background: #f9fafb; }
        input[type=email]:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); background: white; }
        .btn { width: 100%; padding: 13px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 20px; transition: background .2s; }
        .btn:hover { background: #1d4ed8; }
        .back { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
        .back a { color: #2563eb; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><span>Anlık</span>Mekan</div>
    <h1>Şifremi Unuttum</h1>
    <p class="sub">Kayıtlı e-posta adresini gir, şifre sıfırlama bağlantısı gönderelim.</p>
    <form method="POST">
        {% csrf_token %}
        <label for="id_email">E-posta Adresi</label>
        {{ form.email }}
        <button type="submit" class="btn">Sıfırlama Bağlantısı Gönder</button>
    </form>
    <div class="back"><a href="{% url 'login' %}">← Giriş sayfasına dön</a></div>
</div>
</body>
</html>
